<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Símbolo de Matella (promo/engine.js · logoMark): cuatro cuadros, borde y sombra de tinta, girado −4° -->
  <defs>
    <clipPath id="m">
      <rect x="-50" y="-50" width="100" height="100" rx="28" />
    </clipPath>
  </defs>
  <g transform="translate(58 58) rotate(-4)">
    <rect x="-45" y="-45" width="100" height="100" rx="28" fill="#1D2733" />
    <g clip-path="url(#m)">
      <rect x="-50" y="-50" width="50.5" height="50.5" fill="#2F6FDB" />
      <rect x="0" y="-50" width="50.5" height="50.5" fill="#E0A100" />
      <rect x="-50" y="0" width="50.5" height="50.5" fill="#D9502E" />
      <rect x="0" y="0" width="50.5" height="50.5" fill="#1D2733" />
    </g>
    <rect x="-50" y="-50" width="100" height="100" rx="28" fill="none" stroke="#1D2733" stroke-width="7" />
